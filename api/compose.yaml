name: senbud
services:
  api:
    build: .
    ports:
      - "8080:80"
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: senbud
      DB_USERNAME: senbud
      DB_PASSWORD: senbud
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: senbud
      POSTGRES_USER: senbud
      POSTGRES_PASSWORD: senbud
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senbud -d senbud"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db:
