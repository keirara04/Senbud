# Builds the three production images on GitHub's machines instead of the droplet, pushes them to
# GitHub's container registry, then asks Dokploy to redeploy. The droplet only pulls and restarts.
#
# Images (Dokploy apps use Provider "Docker" with these, tag :latest):
#   ghcr.io/keirara04/senbud-api   api/Dockerfile      -> api.senbud.com
#   ghcr.io/keirara04/senbud-web   web/Dockerfile      -> senbud.com
#   ghcr.io/keirara04/senbud-app   mobile/Dockerfile   -> app.senbud.com
#
# Repo secrets, one Dokploy deploy webhook per app (app -> Deployments -> Webhook URL):
#   DOKPLOY_WEBHOOK_API, DOKPLOY_WEBHOOK_WEB, DOKPLOY_WEBHOOK_APP
# A missing secret skips that deploy; the image is still pushed.
name: Build and deploy images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: Build all three images, even if their files didn't change
        type: boolean
        default: true

concurrency:
  group: images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.pick.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            web:
              - 'web/**'
              - 'packages/core/**'
              - 'package.json'
              - 'package-lock.json'
            app:
              - 'mobile/**'
              - 'packages/core/**'
              - 'package.json'
              - 'package-lock.json'
              - '.dockerignore'
      - id: pick
        env:
          ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.all }}
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$ALL" = "true" ]; then echo 'images=["api","web","app"]' >> "$GITHUB_OUTPUT"
          else echo "images=$CHANGED" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - id: cfg
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          case "$IMAGE" in
            api) echo "context=api" >> "$GITHUB_OUTPUT"; echo "file=api/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            web) echo "context=." >> "$GITHUB_OUTPUT"; echo "file=web/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            app) echo "context=." >> "$GITHUB_OUTPUT"; echo "file=mobile/Dockerfile" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/senbud-$IMAGE" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.cfg.outputs.context }}
          file: ${{ steps.cfg.outputs.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.cfg.outputs.name }}:latest
            ${{ steps.cfg.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Ask Dokploy to redeploy
        env:
          IMAGE: ${{ matrix.image }}
          HOOK_API: ${{ secrets.DOKPLOY_WEBHOOK_API }}
          HOOK_WEB: ${{ secrets.DOKPLOY_WEBHOOK_WEB }}
          HOOK_APP: ${{ secrets.DOKPLOY_WEBHOOK_APP }}
        run: |
          case "$IMAGE" in api) HOOK="$HOOK_API" ;; web) HOOK="$HOOK_WEB" ;; app) HOOK="$HOOK_APP" ;; esac
          if [ -z "$HOOK" ]; then echo "No webhook secret for $IMAGE; skipping the deploy."; exit 0; fi
          curl -fsS -X POST "$HOOK" -o /dev/null -w "Dokploy answered %{http_code}\n"
