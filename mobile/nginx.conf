server {
  listen 80;
  root /usr/share/nginx/html;

  # expo-sqlite on web keeps data in OPFS through SharedArrayBuffer, which needs a
  # cross-origin isolated page. Without these two headers the app is blank.
  # Keep every add_header here: one inside a location block drops these for that location.
  add_header Cross-Origin-Embedder-Policy credentialless always;
  add_header Cross-Origin-Opener-Policy same-origin always;

  # Clean URLs: /settings serves settings.html.
  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  # nginx's mime.types has no entry for the web app manifest ("Add to Home Screen").
  location = /manifest.webmanifest { default_type application/manifest+json; }

  error_page 404 /+not-found.html;
}
