<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Senbud logo concepts</title>
<style>
  :root { --panel:#1f3fd8; --hl:#eeff5a; --ink:#1a1c2e; --paper:#f5f6fa; --navy:#0b1033; }
  * { box-sizing: border-box; }
  body { margin:0; background:#e9ebf3; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif; padding:24px; }
  h1 { margin:0 0 4px; font-size:22px; }
  .concept { background:#fff; border-radius:20px; padding:20px; margin:18px 0; }
  .concept h2 { margin:0 0 2px; font-size:18px; }
  .concept p { margin:0 0 14px; color:#565b75; font-size:14px; }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:stretch; }
  .tile { border-radius:16px; padding:18px 22px; display:flex; align-items:center; gap:10px; min-height:84px; }
  .on-panel { background:var(--panel); color:#f4f6ff; }
  .on-paper { background:var(--paper); color:var(--ink); border:1px solid #dfe2ec; }
  .on-navy { background:var(--navy); color:#eef0ff; }
  .word { font-size:26px; font-weight:650; letter-spacing:-.022em; }
  .word em { font-style:normal; position:relative; z-index:0; }
  .word em::before { content:""; position:absolute; inset:58% -2px 4% -2px; background:var(--hl); z-index:-1; border-radius:2px; transform:skewX(-8deg); }
  .on-panel .word em, .on-navy .word em { color:var(--ink); }
  .on-panel .word em::before, .on-navy .word em::before { inset:12% -3px 6% -3px; }
  .sizes { display:flex; gap:14px; align-items:end; background:var(--paper); border:1px solid #dfe2ec; }
  .sizes span { font-size:11px; color:#565b75; display:block; text-align:center; margin-top:4px; }
  .appicon { width:84px; height:84px; border-radius:20px; display:grid; place-items:center; }
  .appicon.blue { background:var(--panel); }
  .appicon.yellow { background:var(--hl); }
  .appicon img { width:62px; height:62px; }
  .appicon.full img { width:84px; height:84px; }
</style>
</head>
<body>
<h1>Senbud logo concepts</h1>
<div id="root"></div>
<script>
const concepts = [
  { id: "a-receipt-buddy", name: "A · Receipt Buddy", note: "Keeps today's receipt idea but gives it a face, so it reads as a friendly buddy, with a highlighter swipe for the brand accent.", fullTile: false },
  { id: "b-sen-sprout", name: "B · Sen Sprout", note: "Spells out the name: a sen (cent) coin with a bud growing out of it, money that grows. Warmer and more distinctive, less about receipts.", fullTile: false },
  { id: "c-highlight-s", name: "C · Highlighter S", note: "A bold S monogram on a highlighter stroke. The simplest and strongest as an app icon and favicon, the least playful.", fullTile: true },
];
const root = document.getElementById("root");
for (const c of concepts) {
  const src = `${c.id}.svg`;
  const lock = (cls) => `<div class="tile ${cls}"><img src="${src}" width="40" height="40" alt=""><span class="word">Sen<em>bud</em></span></div>`;
  const icon = c.fullTile
    ? `<div class="appicon full"><img src="${src}" alt=""></div>`
    : `<div class="appicon blue"><img src="${src}" alt=""></div><div class="appicon yellow"><img src="${src}" alt=""></div>`;
  const sizes = [16, 24, 32, 48].map((s) => `<div><img src="${src}" width="${s}" height="${s}" alt=""><span>${s}px</span></div>`).join("");
  root.insertAdjacentHTML("beforeend", `
    <section class="concept">
      <h2>${c.name}</h2><p>${c.note}</p>
      <div class="row">
        ${lock("on-panel")}${lock("on-paper")}${lock("on-navy")}
        ${icon}
        <div class="tile sizes">${sizes}</div>
      </div>
    </section>`);
}
</script>
</body>
</html>
