server {
  listen 80;
  root /usr/share/nginx/html;

  # Keep every add_header here: one inside a location block drops these for that location.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Clean URLs: /privacy serves privacy.html.
  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  # Next exports these image routes without a file extension.
  location = /opengraph-image { default_type image/png; }
  location = /apple-icon { default_type image/png; }

  # Hashed build assets never change.
  location /_next/static/ { expires 1y; }

  error_page 404 /404.html;
}
